name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            renderer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Lint
        run: npm --prefix app run lint

      - name: Typecheck
        run: npm --prefix app run typecheck

      - name: Run app tests with coverage
        run: npm --prefix app run test:coverage

      - name: Run renderer unit tests
        run: npm --prefix renderer run test:unit

      - name: Enforce coverage thresholds
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summaryPath = 'app/coverage/coverage-summary.json';

          if (!fs.existsSync(summaryPath)) {
            console.error(`Coverage summary not found: ${summaryPath}`);
            process.exit(1);
          }

          const total = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
          // Measured against ALL source files (vitest coverage.all=true), not
          // only files a test imports. These are honest floors set just below
          // current coverage (~75/74.5/75.7/65.8); ratchet upward as coverage
          // improves. Do NOT lower them to make a red build pass.
          const thresholds = {
            lines: 73,
            statements: 72,
            functions: 73,
            branches: 63,
          };

          const failures = Object.entries(thresholds)
            .filter(([metric, min]) => Number(total?.[metric]?.pct ?? 0) < min)
            .map(([metric, min]) => `${metric} ${Number(total?.[metric]?.pct ?? 0)}% < ${min}%`);

          console.log(
            `Coverage totals: lines=${total.lines.pct}% statements=${total.statements.pct}% functions=${total.functions.pct}% branches=${total.branches.pct}%`
          );

          if (failures.length > 0) {
            console.error('Coverage threshold check failed:');
            failures.forEach((item) => console.error(`- ${item}`));
            process.exit(1);
          }

          console.log('Coverage thresholds satisfied.');
          NODE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage
          if-no-files-found: ignore

  e2e-and-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            renderer/package-lock.json

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Build renderer
        run: npm --prefix renderer run build

      - name: Enforce renderer bundle budgets
        run: npm --prefix renderer run performance:budget

      - name: Install Playwright Chromium
        run: npm --prefix renderer exec -- playwright install --with-deps chromium

      # Full end-to-end suite (functional + performance specs) against the
      # built preview server. Budget env vars keep the performance spec honest.
      - name: Run Playwright end-to-end suite
        env:
          PLAYWRIGHT_USE_PREVIEW: 'true'
          DASHBOARD_STARTUP_BUDGET_MS: '5000'
          DASHBOARD_FORECAST_REQUEST_BUDGET: '1'
        run: npm --prefix renderer run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: renderer/playwright-report
          if-no-files-found: ignore

  package-smoke:
    # The 3-OS Electron build is the heaviest job. Run it on pushes to main and
    # on manual dispatch; skip it on PRs (which still get the full test, e2e,
    # and performance validation above) to keep fork/PR CI affordable.
    if: ${{ github.event_name != 'pull_request' }}
    needs: [test, e2e-and-performance]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            renderer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Build renderer
        run: npm --prefix renderer run build

      - name: Build Electron package (smoke)
        run: npm --prefix app run pack

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-package-${{ matrix.os }}
          path: dist/**
          if-no-files-found: ignore
